# Installed once by install.sh before Variety's first start; Variety fills in every other option.
# install.sh keeps change_interval at rotation_minutes from then on.
change_on_start = True
change_enabled = True
change_interval = {INTERVAL}
use_landscape_enabled = False
min_size_enabled = False
lightness_enabled = False
min_rating_enabled = False
desired_color_enabled = False
smart_enabled = False
smart_notice_shown = True
smart_register_shown = True
stats_enabled = False
stats_notice_shown = True
sync_enabled = False
copyto_enabled = False
clipboard_enabled = False
clock_enabled = False
quotes_enabled = False

# Every built-in source is listed so Variety doesn't append them enabled.
[sources]
src1 = True|folder|{FOLDER}
src2 = False|favorites|The Favorites folder
src3 = False|fetched|The Fetched folder
src4 = False|apod|NASA Astronomy Picture of the Day
src5 = False|bing|Bing Photo of the Day
src6 = False|earthview|Google Earth View
src7 = False|unsplash|Unsplash

[filters]
filter1 = False|Keep original|
filter2 = False|Grayscale|-type Grayscale
filter3 = False|Heavy blur|-blur 120x40
filter4 = False|Soft blur|-blur 20x7
filter5 = False|Oil painting|-paint 8
filter6 = False|Pointilism|-spread 10 -noise 3
filter7 = False|Pixellate|-scale 3% -scale 3333%
